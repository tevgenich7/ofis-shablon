# Настройки офиса для Codex (OpenAI). Claude Code этот файл не читает.
# Правила офиса Codex берёт из AGENTS.md, скиллы из .agents/skills/, сотрудников из .codex/agents/,
# защиту из .codex/hooks.json (путь к сторожам через git, файл одинаков на любом компьютере).
# Проверено живьём 17.09.2026 на codex-cli 0.154, порядок проверки - .codex/README.md.

# Песочница: писать только внутри папки офиса. Вопросов не задаёт:
# что нельзя, режут сторожа (.codex/hooks), а не диалог.
sandbox_mode = "workspace-write"
approval_policy = "never"

# Сеть из песочницы включена. Без этого расшифровка речи (Deepgram), бот в телеграме,
# стоки и картинки, запущенные из-под панели, до интернета не дойдут: Codex по умолчанию
# режет сеть в режиме workspace-write. Защита офиса - не песочница, а сторожа хуков:
# deny-guard режет curl/wget/ssh/установку пакетов/git push, secret-guard - правку ключей.
# Синтаксис секции сверен с документацией Codex CLI (16.09.2026).
[sandbox_workspace_write]
network_access = true

# Поиск в интернете - инструмент Codex вне песочницы. Нужен Скауту; остальные по правилам
# офиса в интернет не ходят.
web_search = "live"
